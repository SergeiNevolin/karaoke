[project]
name = "karaoke-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["karaoke_api/tests", "karaoke_ml_service/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["data", "music", "output", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "SIM108",  # тернарник не всегда читабельнее if/else
    "B008",    # Depends()/File() в сигнатурах FastAPI — идиома фреймворка
]

[tool.ruff.lint.per-file-ignores]
"karaoke_api/tests/*" = ["E501"]
