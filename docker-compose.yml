# Standalone-запуск: весь стек караоке без bebradio, включая вход (AUTH_JWT_SECRET пустой).
# Данные: объекты песен — Silo (бакет karaoke), каталог и реестр задач — PostgreSQL (БД
# karaoke, обязателен); ./data — рабочая область (scratch).
# Запуск: docker compose up --build  (интерфейс на http://localhost:8002)
services:
  postgres:
    image: postgres:16-alpine
    # 5433, чтобы не конфликтовать с postgres из bebradio (5432)
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: karaoke
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d karaoke"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  silo:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    # порты 91xx, чтобы не конфликтовать с Silo из bebradio (9000/9001)
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data
    environment:
      - MINIO_ROOT_USER=siloadmin
      - MINIO_ROOT_PASSWORD=siloadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  karaoke-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: karaoke-service:local
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      KARAOKE_ML_SERVICE_URL: ${KARAOKE_ML_SERVICE_URL:-http://localhost:8001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      MAX_BUNDLE_MB: ${MAX_BUNDLE_MB:-2048}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://silo:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-siloadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-siloadmin}
      S3_BUCKET: ${S3_BUCKET:-karaoke}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/karaoke}
    depends_on:
      postgres:
        condition: service_healthy
      silo:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  miniodata:
  pgdata:
