# Standalone-запуск: весь стек караоке без bebradio, включая вход (AUTH_JWT_SECRET пустой).
# Данные — в MinIO (бакет karaoke); ./data — рабочая область + источник миграции:
#   docker compose run --rm karaoke-service python -m karaoke_api.cli.migrate_storage
# Запуск: docker compose up --build  (интерфейс на http://localhost:8002)
services:
  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    # порты 91xx, чтобы не конфликтовать с MinIO из bebradio (9000/9001)
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  karaoke-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: karaoke-service:local
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      KARAOKE_ML_SERVICE_URL: ${KARAOKE_ML_SERVICE_URL:-http://host.docker.internal:8001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      MAX_BUNDLE_MB: ${MAX_BUNDLE_MB:-2048}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-karaoke}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  miniodata:
